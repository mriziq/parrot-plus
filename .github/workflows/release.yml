name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (for example, 1.2.3)"
        required: true
        type: string
      publish:
        description: "Create a GitHub release instead of only uploading an artifact"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    env:
      KEYCHAIN_PATH: ${{ runner.temp }}/parrot-signing.keychain-db
      CERT_PATH: ${{ runner.temp }}/developer-id.p12
      DEVELOPER_ID_APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
      DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check signing secrets
        run: |
          missing=0
          for name in \
            DEVELOPER_ID_APPLICATION_P12 \
            DEVELOPER_ID_APPLICATION_P12_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_PRIVATE_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Version must be numeric like 1.2.3 (got '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swift-

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$DEVELOPER_ID_APPLICATION_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          if [ -f "$LOGIN_KEYCHAIN" ]; then
            security list-keychains -d user -s "$KEYCHAIN_PATH" "$LOGIN_KEYCHAIN"
          else
            security list-keychains -d user -s "$KEYCHAIN_PATH"
          fi
          IDENTITIES="$(security find-identity -v -p codesigning)"
          echo "$IDENTITIES"
          IDENTITY="$(printf '%s\n' "$IDENTITIES" \
            | sed -n "s/.*\"\\(Developer ID Application: .*($APPLE_TEAM_ID)\\)\".*/\\1/p" \
            | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity for team $APPLE_TEAM_ID"
            exit 1
          fi
          echo "PARROT_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build app
        run: scripts/build-app.sh "${{ steps.version.outputs.version }}"

      - name: Notarize app
        run: |
          rm -f "$RUNNER_TEMP/Parrot-Plus.zip"
          ditto -c -k --keepParent "build/Parrot Plus.app" "$RUNNER_TEMP/Parrot-Plus.zip"
          scripts/notarize.sh "$RUNNER_TEMP/Parrot-Plus.zip"
          xcrun stapler staple "build/Parrot Plus.app"
          xcrun stapler validate "build/Parrot Plus.app"

      - name: Package DMG
        id: dmg
        run: |
          DMG="$(scripts/make-dmg.sh "${{ steps.version.outputs.version }}")"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - name: Sign DMG
        env:
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          codesign --force --timestamp --sign "$PARROT_SIGN_IDENTITY" "$DMG"
          codesign --verify --verbose=2 "$DMG"

      - name: Notarize DMG
        env:
          DMG: ${{ steps.dmg.outputs.path }}
        run: scripts/notarize.sh "$DMG"

      - name: Staple and verify
        env:
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -vvv "$DMG"
          spctl --assess --type exec -vvv "build/Parrot Plus.app"

      - name: Write checksum
        env:
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          cd "$(dirname "$DMG")"
          shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256"
          cat "$(basename "$DMG").sha256"

      - name: Upload dry-run artifact
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: Parrot-Plus-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.dmg.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.dmg.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="**Requirements:** macOS 14+ on Apple Silicon. The first launch downloads the selected speech model. **Checksum:** see the attached .sha256 file."
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" \
              --verify-tag --generate-notes --notes "$NOTES" --title "Parrot Plus $VERSION"
          else
            gh release create "v$VERSION" "$DMG" "$DMG.sha256" \
              --target "$GITHUB_SHA" --generate-notes --notes "$NOTES" --title "Parrot Plus $VERSION"
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$CERT_PATH" "$RUNNER_TEMP/Parrot-Plus.zip"
